apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
        - name: backend-container
          image: tien22012003/code-gym-server:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: CLIENT_URL
              value: "http://localhost:3000"
            - name: DB_HOST
              value: "oracle-db-service:1521"
            - name: REDIS_HOST
              value: "redis-service:6379"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort